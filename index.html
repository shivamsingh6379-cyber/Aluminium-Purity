<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Purity Calculator Suite | Premium Edition</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- ====== LOGIN WRAPPER ====== -->
    <div class="login-wrapper" id="loginWrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>🔐 Purity Suite</h2>
                <p>Sign in to access premium calculators</p>
            </div>

            <!-- Login Tabs -->
            <div class="login-tabs">
                <button class="login-tab-btn active" id="loginTabSignin" onclick="switchLoginTab('signin')">Sign In</button>
                <button class="login-tab-btn" id="loginTabSignup" onclick="switchLoginTab('signup')">Sign Up</button>
            </div>

            <!-- Message Box -->
            <div class="msg-box" id="loginMsg"></div>

            <!-- Sign In Form -->
            <div id="signinForm">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" />
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" />
                </div>
                <button class="login-btn" onclick="handleLogin()">Sign In</button>
                <div class="forgot-link">
                    <span onclick="sendPasswordReset()">🔑 Forgot password?</span>
                </div>
            </div>

            <!-- Sign Up Form -->
            <div id="signupForm" style="display:none;">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" />
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="signupPassword" placeholder="min 6 chars" />
                </div>
                <button class="login-btn" onclick="handleSignup()">Create Account</button>
            </div>

            <!-- Social Connect -->
            <div class="social-connect">
                <a href="https://www.instagram.com/itzz__mahesh___07?igsh=MXZlYjQ2M3Q1Y2RmaA=="
                   target="_blank"
                   rel="noopener noreferrer"
                   class="instagram-link">
                    <i class="fab fa-instagram"></i>
                    <span class="link-text">itzz__mahesh___07 <span>• follow</span></span>
                </a>
            </div>
        </div>
    </div>

    <!-- ====== APP WRAPPER ====== -->
    <div class="app-wrapper" id="appWrapper">
        <div class="container">

            <!-- Header -->
            <div class="header">
                <a href="https://www.instagram.com/itzz__mahesh___07?igsh=MXZlYjQ2M3Q1Y2RmaA=="
                   target="_blank"
                   rel="noopener noreferrer"
                   class="header-instagram">
                    <i class="fab fa-instagram"></i>
                    <span class="insta-label">itzz__mahesh___07</span>
                </a>
                <h2>🧮 Purity Suite</h2>
                <button class="logout-btn" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
            <div class="sub">⚡ Premium Calculators • Secure • Real‑time</div>

            <!-- App Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('purity')">💎 Purity</button>
                <button class="tab-btn" onclick="switchTab('bmi')">⚖️ BMI</button>
                <button class="tab-btn" onclick="switchTab('cgpa')">📊 CGPA</button>
            </div>

            <!-- ===== TAB 1: PURITY ===== -->
            <div class="tab-panel active-panel" id="panelPurity">
                <div class="input-group">
                    <label><span class="label-icon">📊</span> Total Marks</label>
                    <input type="number" id="purityTotal" placeholder="e.g. 500" />
                </div>
                <div class="input-group">
                    <label><span class="label-icon">✅</span> Obtained Marks</label>
                    <input type="number" id="purityObtained" placeholder="e.g. 450" />
                </div>
                <button class="calc-btn" onclick="calculatePurity()">Calculate Purity</button>
                <div class="result" id="purityResult">💎 Your purity score will appear here</div>
            </div>

            <!-- ===== TAB 2: BMI ===== -->
            <div class="tab-panel" id="panelBmi">
                <div class="double-row">
                    <div class="input-group">
                        <label><span class="label-icon">📏</span> Height (cm)</label>
                        <input type="number" id="bmiHeight" placeholder="e.g. 175" />
                    </div>
                    <div class="input-group">
                        <label><span class="label-icon">⚖️</span> Weight (kg)</label>
                        <input type="number" id="bmiWeight" placeholder="e.g. 70" />
                    </div>
                </div>
                <button class="calc-btn" onclick="calculateBMI()">Calculate BMI</button>
                <div class="result" id="bmiResult">⚖️ Your BMI will appear here</div>
            </div>

            <!-- ===== TAB 3: CGPA ===== -->
            <div class="tab-panel" id="panelCgpa">
                <div class="input-group">
                    <label><span class="label-icon">📚</span> Total GPA</label>
                    <input type="number" id="cgpaTotal" placeholder="e.g. 40" step="0.01" />
                </div>
                <div class="input-group">
                    <label><span class="label-icon">📘</span> Number of Subjects</label>
                    <input type="number" id="cgpaSubjects" placeholder="e.g. 8" />
                </div>
                <button class="calc-btn" onclick="calculateCGPA()">Calculate CGPA</button>
                <div class="result" id="cgpaResult">📊 Your CGPA will appear here</div>
            </div>

        </div>
    </div>

    <!-- ====== EXTERNAL JAVASCRIPT ====== -->
    <script src="app.js"></script>
</body>
</html>
